# カスタム層（本リポジトリ）＋専用PostgreSQLのさくらのクラウド構成。
# Canvas本体は別スタック（infra/canvas/）で構築する（CLAUDE.md 絶対ルール1・
# docs/ホスティング方針.md — DBも含めてCanvasとは分離する）。
#
# 使い方は infra/custom-layer/README.md を参照。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aischool
      POSTGRES_USER: aischool_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD を設定してください}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD を設定してください}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    # 校内LAN/外部に公開しない。同一Docker networkの app からのみ接続する
    expose:
      - "5432"
    # 起動直後はまだ接続を受け付けないため、appは健全になるまで待つ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aischool_admin -d aischool"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - custom-layer

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # アプリ本体の設定（Canvas接続・LTI鍵等）。DBだけ先に構築する段階では未作成でよい
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://aischool_app:${DB_APP_PASSWORD}@db:5432/aischool
      DATABASE_ADMIN_URL: postgres://aischool_admin:${DB_ADMIN_PASSWORD}@db:5432/aischool
    depends_on:
      db:
        condition: service_healthy
    # ホスト側で動くCanvas（infra/canvas/）へコンテナから到達するための名前。
    # CANVAS_BASE_URL に localhost/127.0.0.1 を書くとコンテナ自身を指して必ず失敗する
    # （README「Canvasへの到達性」参照）。公開URLを使う場合はこの設定は不要。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # **必ず127.0.0.1に限定する**。0.0.0.0で公開するとリバースプロキシ
      # （Caddy=TLS終端／nginx=Basic認証）を迂回してアプリが直接インターネットへ
      # 露出する（docs/実装状況.md「アクセス制御の現状」の方針違反）。
      # 公開はリバースプロキシ経由のみ。既存のCaddy/nginxが別ポートを見ている場合は
      # APP_HOST_PORT で合わせる（例: APP_HOST_PORT=3001）
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    networks:
      - custom-layer

networks:
  custom-layer:

volumes:
  db-data:
